[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-record-compiler"
version = "0.1.0"
description = "Clinical document compiler"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_compiler = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=clinical_compiler --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clinical_compiler"]
